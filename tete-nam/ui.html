<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tête NAM</title>
<style>
:root{
  --fond:#111317;--barre:#16191e;--carte:#181b21;--carte2:#20242b;--trait:#262a31;--trait2:#3a3f48;
  --texte:#e8e8ea;--doux:#8a8f99;--accent:#ffb547;--ok:#7bd88f;--moyen:#e0a800;--mal:#ff6b6b;
  --dyn:#1f4fa8;--drive:#b0552a;--nam1:#7a2c1d;--nam2:#43160e;--filtre:#7d6d1c;--mod:#6b3fa0;--temps:#245a7a;--util:#4a505a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--fond)}
body{color:var(--texte);font:15px/1.3 system-ui,"DejaVu Sans",Arial,sans-serif;display:flex;flex-direction:column;
  overflow:hidden;user-select:none;-webkit-user-select:none;max-width:1200px;margin:0 auto}
body.ecran{cursor:none}
body.ecran *{cursor:none!important}
/* Écran de la tête : logo tant que le moteur audio démarre (suite du logo de démarrage) */
#demarrage{display:none;position:fixed;inset:0;z-index:100;background:#000;flex-direction:column;align-items:center;justify-content:center;gap:28px}
body.ecran #demarrage.ouvert{display:flex}
#demarrage img{max-width:70%;max-height:55%}
#demarrage .dbarre{width:45%;height:4px;border-radius:2px;background:var(--trait);overflow:hidden}
#demarrage .dbarre div{width:30%;height:100%;background:#fb0202;animation:dva 1.4s ease-in-out infinite alternate}
@keyframes dva{from{transform:translateX(-100%)}to{transform:translateX(333%)}}
#demarrage .dtxt{color:var(--doux);font-size:14px}
button{font:inherit;color:inherit;background:var(--carte2);border:1px solid var(--trait2);border-radius:10px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(1.3)}
button.prim{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
button.danger{color:var(--mal)}
button:disabled{opacity:.4}

/* Barre du haut */
header{flex:0 0 auto;height:60px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--trait);background:var(--barre)}
header .fleche{width:44px;height:44px;padding:0;font-size:18px}
#presetBtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;text-align:left;padding:4px 6px}
#num{font-size:28px;font-weight:700;color:var(--accent);min-width:44px;text-align:center}
#pnom{font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pinfo{display:block;font-size:12px;color:var(--doux);font-weight:400}
#saveBtn.modif{border-color:var(--accent);color:var(--accent)}
#tunerBtn{font-size:18px;width:44px;height:44px;padding:0}
#statBtn{background:none;border:none;text-align:right;font-size:12px;color:var(--doux);line-height:1.45;padding:2px 4px;white-space:nowrap}
#statBtn b{font-weight:700}

/* Chaîne */
#chaineZone{flex:0 0 auto;position:relative;padding:8px 0 4px}
#rangee{display:flex;align-items:center;gap:12px;overflow-x:hidden;padding:18px 14px 12px;touch-action:none;position:relative;scrollbar-width:none}
#rangee::-webkit-scrollbar{display:none}
.io{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--carte2);border:2px solid #4a505a;font-size:10px;display:flex;align-items:center;justify-content:center;color:#aaa;position:relative;z-index:1}
.fil{position:absolute;left:30px;height:3px;background:var(--trait2);top:calc(50% + 3px);z-index:0}
.blk{flex:0 0 auto;width:96px;height:92px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;position:relative;border:2px solid transparent;z-index:1;text-align:center;padding:4px;color:#fff;transition:transform .15s}
.blk .ic{font-size:22px;line-height:1;margin-bottom:5px}
.blk .st{font-size:11px;font-weight:400;opacity:.9;margin-top:3px;max-width:88px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.off{background:#22252b!important;color:#5d626b}
.blk.sel{border-color:#fff;box-shadow:0 0 0 4px rgba(255,181,71,.55)}
.blk.glisse{z-index:5;transition:none;box-shadow:0 10px 28px rgba(0,0,0,.6),0 0 0 4px rgba(255,181,71,.8);opacity:.95}
.blk.vide{outline:2px dashed var(--mal);outline-offset:2px}
.cat-dyn{background:var(--dyn)}.cat-drive{background:var(--drive)}.cat-nam{background:linear-gradient(160deg,var(--nam1),var(--nam2))}
.cat-filtre{background:var(--filtre)}.cat-mod{background:var(--mod)}.cat-temps{background:var(--temps)}.cat-util{background:var(--util)}
.plus{flex:0 0 auto;width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;z-index:1;border:2px dashed var(--trait2);background:var(--fond);color:var(--doux)}
#aide{text-align:center;color:var(--doux);font-size:11px;height:14px}

/* Réglages du bloc */
#panneau{flex:1 1 auto;min-height:0;margin:6px 10px 10px;background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column}
#ptete{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
#ptitre{font-size:16px;font-weight:700;margin-right:auto;display:flex;align-items:center;gap:8px;min-width:0}
#ptitre .mod{font-weight:400;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--trait2);border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;background:var(--carte2);padding:7px 10px;font-size:13px}
.seg button.on{background:var(--accent);color:#111;font-weight:700}
.bascule.on{background:var(--ok);color:#111;border-color:var(--ok);font-weight:700}
#boutons{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:space-around;gap:6px 4px;overflow-y:auto}
.k{width:112px;text-align:center;touch-action:none;padding:2px 0}
.k svg{width:82px;height:82px;display:block;margin:0 auto 2px}
.k .val{font-size:15px;font-weight:700}
.k .lib{font-size:12px;color:#cfd2d8}
.k.av .lib{color:var(--doux)}
.k.actif svg circle.fondk{stroke:#fff}
.inter{width:112px;text-align:center}
.inter button{min-width:80px}
.inter .lib{font-size:12px;color:#cfd2d8;margin-top:6px}
.cc{display:inline-block;font-size:10px;font-weight:700;color:#111;background:var(--accent);border-radius:5px;padding:0 4px;margin-left:4px;vertical-align:1px}
.midiligne{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--trait);flex-wrap:wrap}
.midiligne .nom{flex:1;min-width:140px;font-size:15px}
.midiligne .quoi{color:var(--doux);font-size:13px;min-width:70px}
#mvivant{font-size:15px;padding:8px 10px;background:var(--carte2);border-radius:10px;margin:6px 0}
#mvivant.recent{color:var(--accent)}
.videmsg{margin:auto;color:var(--doux);text-align:center;font-size:15px;line-height:1.6}

/* Feuilles (fenêtres) */
#voile{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20}
#feuille{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 20px));max-height:calc(100vh - 20px);
  background:var(--carte);border:1px solid var(--trait2);border-radius:16px;display:none;flex-direction:column;z-index:21;overflow:hidden}
#feuille.ouverte,#voile.ouvert{display:flex}
#ftete{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--trait)}
#ftitre{flex:1;font-weight:700;font-size:17px}
#fcorps{padding:12px 14px;overflow-y:auto;touch-action:pan-y}
.liste{display:flex;flex-direction:column;gap:6px}
.liste .ligne{display:flex;gap:8px;align-items:center}
.liste .ligne > button:first-child{flex:1;text-align:left;padding:12px 14px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.liste button.courant{border-color:var(--accent);color:var(--accent);font-weight:700}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:6px 0 14px}
.grille button{height:62px;border:none;color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.grille button span{font-size:20px}
.cattitre{color:var(--doux);font-size:13px;margin-top:4px}
.rangs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
.etiq{color:var(--doux);font-size:13px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--carte2);border-radius:10px;padding:8px}
.stats small{display:block;color:var(--doux);font-size:12px}
.stats b{font-size:20px}
canvas{width:100%;height:70px;display:block;margin-top:8px}
.champ{width:100%;font:inherit;font-size:18px;padding:10px;background:var(--carte2);color:var(--texte);border:1px solid var(--trait2);border-radius:10px}
.clavier{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.clavier div{display:flex;gap:5px;justify-content:center}
.clavier button{flex:1;max-width:62px;height:44px;padding:0;font-size:17px}
.clavier button.large{max-width:220px;flex:4}
.clavier button.moyen{max-width:110px;flex:2}
.boutonsfin{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.pied{color:var(--doux);font-size:12px;margin-top:12px;white-space:pre-line}

/* Accordeur */
#accord{position:fixed;inset:0;background:rgba(10,11,14,.97);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#accord.ouvert{display:flex}
#anote{font-size:120px;font-weight:800;line-height:1}
#anote small{font-size:40px;color:var(--doux)}
#abarre{width:min(560px,90vw);height:16px;border-radius:8px;background:var(--carte2);position:relative}
#abarre::after{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;width:2px;background:var(--doux)}
#aindic{position:absolute;top:-8px;width:12px;height:32px;border-radius:6px;background:var(--accent);left:50%;transform:translateX(-50%);transition:left .12s}
#ahz{color:var(--doux);font-size:16px}

#message{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#3a1d1d;color:#ffd6d6;border:1px solid #7a3434;padding:10px 16px;border-radius:12px;
  z-index:40;display:none;max-width:90vw;font-size:14px}
#message.info{background:#1d2a3a;color:#d6e6ff;border-color:#34507a}
#bandeau{display:none;background:#3a1d1d;color:#ffd6d6;text-align:center;font-size:13px;padding:4px}
#bandeau.ouvert{display:block}
.io.ecrete{background:#c0392b !important;border-color:#ff6b5b !important;color:#fff !important;box-shadow:0 0 10px #ff4b3b}

@media (max-width:620px){
  header{height:auto;flex-wrap:wrap;padding:6px 8px;gap:6px}
  #presetBtn{order:1;flex:1 1 60%}
  #num{font-size:22px;min-width:34px}#pnom{font-size:17px}
  header .fleche{width:40px;height:40px}
  #statBtn{order:2}
  #rangee{overflow-x:auto}
  .k{width:96px}.k svg{width:70px;height:70px}
  .stats{grid-template-columns:repeat(2,1fr)}
  body{overflow:auto}
  #panneau{min-height:260px}
  #boutons{align-content:flex-start;padding-top:14px}
}
/* ===== Thème « studio » : gris anthracite plat, accents turquoise, dégradés
   par famille d'effets, titres fins en capitales espacées. Ce bloc ne change
   que l'apparence ; le retirer redonne le thème d'origine. ===== */
:root{
  --fond:#141414;--barre:#171717;--carte:#1d1d1d;--carte2:#242424;--trait:#2a2a2a;--trait2:#383838;
  --texte:#e4e4e4;--doux:#8a8a8a;--accent:#5fcfd0;--ok:#5fcfd0;--moyen:#e0b04a;--mal:#ff6b6b;
  --piste:#2f2f2f;--arc:3;--piste-ep:2.5;
  --g-dyn:linear-gradient(160deg,#79dcd8,#2c5ca8);
  --g-drive:linear-gradient(160deg,#ea6a4f,#7a32b8);
  --g-nam:linear-gradient(160deg,#a35ce0,#33206e);
  --g-filtre:linear-gradient(160deg,#a8e07c,#2c7158);
  --g-mod:linear-gradient(160deg,#8aa8ff,#4b2fa8);
  --g-temps:linear-gradient(160deg,#5aa6ea,#2b2f80);
  --g-util:linear-gradient(160deg,#6b6b6b,#333);
}
body{font-family:Montserrat,"Jost","Futura","Century Gothic",system-ui,"DejaVu Sans",Arial,sans-serif;letter-spacing:.02em}
button{background:transparent;border:1px solid var(--trait2);border-radius:8px;text-transform:uppercase;font-size:13px;letter-spacing:.12em;font-weight:500}
button.prim{background:var(--accent);border-color:var(--accent);color:#0e1414}
header{background:var(--barre);border-bottom:1px solid var(--trait)}
header .fleche{border-color:transparent;font-size:16px;color:var(--doux)}
#presetBtn{text-transform:none;letter-spacing:.02em}
#num{color:var(--accent);font-weight:400}
#pnom{font-weight:500;letter-spacing:.06em}
#saveBtn{border-color:var(--trait2)}
#saveBtn.modif{border-color:var(--accent);color:var(--accent)}
#tunerBtn{border-color:transparent;color:var(--doux)}
#statBtn{text-transform:none;letter-spacing:.04em}
/* Chaîne : tuiles en dégradé, comme des pavés lumineux */
.io{background:var(--carte);border:1px solid var(--trait2);color:var(--doux);letter-spacing:.1em}
.fil{height:2px;background:var(--trait2)}
.blk{border-radius:10px;border:1px solid rgba(255,255,255,.08);font-weight:500;text-transform:uppercase;letter-spacing:.1em;font-size:12px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.blk .st{text-transform:none;letter-spacing:.02em}
.cat-dyn{background:var(--g-dyn)}.cat-drive{background:var(--g-drive)}.cat-nam{background:var(--g-nam)}
.cat-filtre{background:var(--g-filtre)}.cat-mod{background:var(--g-mod)}.cat-temps{background:var(--g-temps)}.cat-util{background:var(--g-util)}
.blk.off{background:var(--carte2)!important;color:#5a5a5a;box-shadow:none}
.blk.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 18px rgba(95,207,208,.45)}
.blk.glisse{box-shadow:0 10px 28px rgba(0,0,0,.6),0 0 0 2px var(--accent)}
.plus{border:1px dashed var(--trait2);background:transparent;color:var(--doux);font-weight:300;letter-spacing:0}
#aide{letter-spacing:.06em}
/* Panneau du bloc : carte plate, titre fin espacé */
#panneau{background:var(--carte);border:1px solid var(--trait);border-radius:12px}
#ptitre{font-weight:500;text-transform:uppercase;letter-spacing:.28em;font-size:15px}
#ptitre .mod{text-transform:none;letter-spacing:.04em}
.seg{border:none;gap:4px}
.seg button{background:transparent;border:none;color:var(--doux);letter-spacing:.2em}
.seg button.on{background:transparent;color:var(--accent);font-weight:500}
.bascule{color:var(--doux)}
.bascule.on{background:transparent;color:var(--accent);border-color:var(--accent);font-weight:500}
button.danger{border-color:transparent}
/* Boutons rotatifs : fin anneau, valeur au centre, nom en capitales au-dessus */
.k{position:relative;display:flex;flex-direction:column;align-items:center}
.k .lib{order:-1;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:#cfcfcf;margin-bottom:4px;font-weight:500}
.k.av .lib{color:var(--doux)}
.k svg{margin:0 auto}
.k .val{position:absolute;left:0;right:0;top:calc(50% + 7px);transform:translateY(-50%);font-weight:400;font-size:13px;letter-spacing:0;white-space:nowrap;pointer-events:none}
@media (max-width:620px){.k .val{font-size:12px}}
.k.actif svg circle.fondk{stroke:var(--accent)}
.inter .lib{text-transform:uppercase;letter-spacing:.14em;font-size:11px}
/* Fenêtres */
#feuille{background:var(--carte);border:1px solid var(--trait2);border-radius:12px}
#ftitre{font-weight:500;text-transform:uppercase;letter-spacing:.24em;font-size:15px}
.grille button{border-radius:10px;text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:500}
.cattitre,.etiq{text-transform:uppercase;letter-spacing:.18em;font-size:11px}
.liste .ligne > button:first-child{text-transform:none;letter-spacing:.04em}
.liste button.courant{border-color:var(--accent);color:var(--accent)}
.stats div{background:var(--carte2);border-radius:8px}
.stats small{text-transform:uppercase;letter-spacing:.14em;font-size:10px}
.stats b{font-weight:400}
.champ{border-radius:8px}
.clavier button{text-transform:none;letter-spacing:0}
/* Panneau du bloc compact : il prend la hauteur de ses boutons, pas tout l'écran */
#panneau{flex:0 1 auto;padding:8px 14px 10px;margin-top:4px}
#boutons{flex:0 1 auto;padding-top:6px}
@media (max-width:620px){#panneau{min-height:0}#boutons{padding-top:8px}}
#aindic{background:var(--accent)}
#anote{font-weight:300}
/* ===== Charte NO:ID : noir profond, or brossé, capitales fines espacées
   (comme la façade de la tête). Remplace les couleurs du thème « studio »
   au-dessus ; ne change que l'apparence. ===== */
:root{
  --fond:#0b0a09;--barre:#0f0e0c;--carte:#141310;--carte2:#1b1915;--trait:#26231d;--trait2:#3a342a;
  --texte:#ece6da;--doux:#8f877a;--accent:#d6ac5a;--or-clair:#f0d58f;--ok:#d6ac5a;--moyen:#e6a33a;--mal:#e5674f;
  --piste:#2a2620;--arc:3;--piste-ep:2.5;
  --tuile:linear-gradient(165deg,#2a261f 0%,#16140f 60%,#0f0e0b 100%);
}
body{background:radial-gradient(ellipse at 50% 0%,#1a1712 0%,var(--fond) 65%) fixed,var(--fond)}
button.prim{background:linear-gradient(180deg,var(--or-clair),var(--accent));border-color:var(--accent);color:#14110b}
header{background:linear-gradient(180deg,#14120f,var(--barre));border-bottom:1px solid rgba(214,172,90,.25)}
#num{color:var(--accent)}
#pnom{color:var(--texte);letter-spacing:.14em;text-transform:uppercase;font-weight:400}
/* Tuiles : pavés noirs, liseré doré, couleur de la famille en bas */
.blk{background:var(--tuile)!important;color:var(--texte);border:1px solid rgba(214,172,90,.35);box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04)}
.blk .ic{color:var(--accent)}
.blk .st{color:var(--doux)}
.cat-dyn{--fam:#c9a36a}.cat-drive{--fam:#d0703f}.cat-nam{--fam:#e3c070}
.cat-filtre{--fam:#9aa36a}.cat-mod{--fam:#a88bc9}.cat-temps{--fam:#7aa0b8}.cat-util{--fam:#7a7468}
.blk[class*="cat-"]{box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 -3px 0 var(--fam,var(--accent))}
.cat-nam.blk{border-color:rgba(240,213,143,.6)}
.blk.off{background:var(--carte2)!important;color:#5c574d;border-color:var(--trait);box-shadow:none}
.blk.off .ic{color:#5c574d}
.blk.sel{border-color:var(--or-clair);box-shadow:0 0 0 1px var(--or-clair),0 0 22px rgba(214,172,90,.45),inset 0 -3px 0 var(--fam,var(--accent))}
.blk.glisse{box-shadow:0 10px 28px rgba(0,0,0,.7),0 0 0 2px var(--accent)}
.grille button{background:var(--tuile);border:1px solid rgba(214,172,90,.3);color:var(--texte)}
.grille button span{color:var(--accent)}
.io{border-color:rgba(214,172,90,.35);color:var(--accent)}
.fil{background:linear-gradient(90deg,rgba(214,172,90,.15),rgba(214,172,90,.45),rgba(214,172,90,.15))}
.plus{border-color:rgba(214,172,90,.45);color:var(--accent)}
/* Panneaux : noir, filet doré fin */
#panneau,#feuille{background:linear-gradient(180deg,#16140f,var(--carte));border-color:rgba(214,172,90,.22)}
#ptitre,#ftitre{color:var(--or-clair);font-weight:400}
/* Boutons rotatifs : capuchon noir, anneau doré lumineux */
.k svg circle.fondk{fill:#0a0908;stroke:rgba(214,172,90,.18)}
.k svg path:nth-of-type(2){filter:drop-shadow(0 0 3px rgba(214,172,90,.7))}
.k .val{color:var(--texte)}
.k .lib{color:#d9cfbd}
#demarrage{background:#000}
/* ===== Mise en page de l'écran : le panneau de réglages touche le bas,
   la ligne d'effets est centrée dans la place au-dessus ===== */
#chaineZone{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center}
#panneau{margin:0;border-radius:14px 14px 0 0;border-bottom:none}
/* Wi-Fi */
.wetat{color:var(--doux);font-size:14px}
.wetat b{color:var(--texte);font-weight:500}

</style></head><body>
<div id="demarrage" class="ouvert"><img src="/logo.png" alt="Tête NAM" onerror="this.style.display='none'"><div class="dbarre"><div></div></div><div class="dtxt">Démarrage du moteur audio…</div></div>
<div id="bandeau"></div>
<div id="veille"><img id="vlogo" src="logo.png" alt="NO:ID" onerror="this.style.visibility='hidden'">
  <div id="vzone"><canvas id="vonde"></canvas><div id="vpreset"><div id="vnum"></div><div id="vnom"></div></div></div></div>
<header>
  <button class="fleche" id="prec" aria-label="Preset précédent">◀</button>
  <button id="presetBtn"><span id="num">–</span><span style="min-width:0"><span id="pnom">…</span><span id="pinfo"></span></span></button>
  <button class="fleche" id="suiv" aria-label="Preset suivant">▶</button>
  <button id="saveBtn">Enregistrer</button>
  <button id="tunerBtn" aria-label="Accordeur">♪</button>
  <button id="statBtn"><span id="sdsp">DSP –</span><br><span id="stemp"></span></button>
</header>
<div id="chaineZone"><div id="rangee"></div><div id="aide"></div></div>
<section id="panneau"><div class="videmsg">Connexion à la tête…</div></section>

<div id="voile"></div>
<div id="feuille"><div id="ftete"><div id="ftitre"></div><button id="ffermer">Fermer</button></div><div id="fcorps"></div></div>
<div id="accord"><div id="anote">–</div><div id="abarre"><div id="aindic"></div></div><div id="ahz">Jouez une corde</div>
  <button id="afermer" style="margin-top:24px;padding:12px 30px;font-size:17px">Fermer l'accordeur</button></div>
<div id="message"></div>
<input type="file" id="fichiers" accept=".nam,.wav" multiple hidden>

<script>
"use strict";
const $ = id => document.getElementById(id);
const ECRAN = new URLSearchParams(location.search).has("ecran");
if (ECRAN) document.body.classList.add("ecran");
const TRANSPORT = () => typeof window.teteTransport === "function";
const BLE = () => TRANSPORT() && !window.teteDemo;   // Bluetooth : rafraîchissement plus lent (pas pour la démo)

/* Tous les appels au serveur passent par ici. Dans l'appli Android,
   window.teteTransport(chemin, corps) les transmet en Bluetooth. */
async function api(chemin, corps) {
  if (TRANSPORT()) return window.teteTransport(chemin, corps === undefined ? null : corps);
  const o = corps === undefined ? {} :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corps)};
  const r = await fetch(chemin, o);
  return r.json();
}

let E = null, T = null, C = null;      // état, tout, config
let sel = null;                        // bloc sélectionné
let occupe = 0;                        // > 0 : l'utilisateur manipule (pas de redessin)
let aRedessiner = false;
const locales = {};                    // valeurs changées ici, prioritaires un moment

const echap = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function message(txt, info) {
  const m = $("message"); m.textContent = txt; m.className = info ? "info" : "";
  m.style.display = "block"; clearTimeout(message.t);
  message.t = setTimeout(() => m.style.display = "none", info ? 2500 : 5000);
}
async function action(chemin, corps) {
  try {
    const r = await api(chemin, corps);
    if (!r || r.ok === false) { message((r && r.erreur) || "Erreur"); return null; }
    return r;
  } catch (e) { message("Pas de réponse de la tête"); return null; }
}

/* ---------- Formats ---------- */
function decimales(f) { const m = /\{0:0\.?(0*)\}/.exec(f || ""); return m ? m[1].length : 2; }
function unite(f) {
  const u = (f || "").replace(/\{[^}]*\}/, "").trim();
  return ({hz: " Hz", db: " dB", dB: " dB", ms: " ms"})[u] ?? (u ? " " + u : "");
}
function fmt(p, v) {
  if (p.type === "liste") { const i = p.valeurs.indexOf(v); return i >= 0 ? p.libelles[i] : v; }
  if (p.type === "fichier") return v || "–";
  if (p.type === "interrupteur") return (+v) ? "Oui" : "Non";
  const n = +v; return (Number.isFinite(n) ? n.toFixed(p.type === "entier" ? 0 : decimales(p.format)) : "–") + unite(p.format);
}
const typeDe = id => id.split("_")[0];
const cfgType = t => C && C.types[t];
function valeur(b, nom) {
  const l = locales[b.id + "|" + nom];
  if (l && Date.now() - l.t < 2000) return l.v;
  return b.valeurs[nom];
}
function nomBloc(b) {
  const c = cfgType(b.type); let n = c ? c.court : b.type;
  const num = b.id.split("_")[1]; if (num) n += " " + num;
  return n;
}
function resume(b) {
  const c = cfgType(b.type); if (!c) return "";
  if (b.type === "NAM") return nomAffiche(valeur(b, "Model")) || "aucun modèle";
  if (b.type === "Cabinet") return b.actif ? (valeur(b, "Impulse") || "aucune IR") : "bypass";
  if (!b.actif) return "bypass";
  const p = c.params.find(p => !p.avance && p.type === "bouton");
  return p ? fmt(p, valeur(b, p.nom)) : "";
}

/* ---------- Barre du haut ---------- */
function dessinerHaut() {
  if (!E) return;
  $("num").textContent = E.numero ?? "–";
  $("pnom").textContent = E.preset || "Sans nom";
  $("pinfo").textContent = E.chargement ? "chargement…" : (E.modifie ? "modifié ●" : (T ? T.presets.length + " presets" : ""));
  $("saveBtn").classList.toggle("modif", !!E.modifie);
  const d = E.dsp;
  $("sdsp").innerHTML = "DSP <b style='color:" + (d == null ? "var(--doux)" : d < 70 ? "var(--ok)" : d < 85 ? "var(--moyen)" : "var(--mal)") + "'>" +
    (d == null ? "–" : Math.round(d) + " %") + "</b>" + (E.xruns ? " · <b style='color:var(--mal)'>" + E.xruns + " xr</b>" : "");
  const recent = E.midi && E.midi.age != null && E.midi.age < 1.5;
  $("stemp").innerHTML = (recent ? "<b style='color:var(--accent)'>MIDI</b> " : "") + (E.temp == null ? "" : Math.round(E.temp) + " °C");
  synchroAccordeur();
  presetEnVeille();
  // Logo de démarrage (écran de la tête) : jusqu'au moteur prêt, 60 s au plus
  if (E.moteur || performance.now() > 60000) $("demarrage").classList.remove("ouvert");
  const b = $("bandeau"), n = E.niveaux || {};
  const alerte = !E.moteur ? "Le moteur audio ne répond pas (redémarrage en cours ?)" :
    n.frequence_ok === false ? `La carte son tourne à ${n.frequence / 1000} kHz au lieu de 48 kHz : le son des modèles NAM est faussé` : "";
  b.classList.toggle("ouvert", !!alerte);
  b.textContent = alerte;
  majEcretage();
  dessinerAccordeur();
}
/* IN ou OUT en rouge quelques secondes après un écrêtage de la carte son
   (entrée trop forte pour le convertisseur, ou sortie au-delà de 0 dBFS) */
function majEcretage() {
  const n = (E && E.niveaux) || {};
  const i = $("ioIn"), o = $("ioOut");
  if (i) { i.classList.toggle("ecrete", !!n.ecrete_entree); i.title = n.ecrete_entree ? "L'entrée écrête : baissez le gain de la carte son" : ""; }
  if (o) { o.classList.toggle("ecrete", !!n.ecrete_sortie); o.title = n.ecrete_sortie ? "La sortie écrête : baissez le volume des blocs ou le volume général" : ""; }
}

/* ---------- Chaîne ---------- */
function dessinerChaine() {
  const r = $("rangee");
  if (!T || !C) return;
  const sc = r.scrollLeft;
  let h = '<div class="io" id="ioIn">IN</div>';
  for (const b of T.chaine) {
    const c = cfgType(b.type) || {categorie: "util", icone: "?"};
    const vide = (b.type === "NAM" && !valeur(b, "Model")) || (b.type === "Cabinet" && !valeur(b, "Impulse"));
    h += `<div class="blk cat-${c.categorie}${b.actif ? "" : " off"}${b.id === sel ? " sel" : ""}${vide ? " vide" : ""}" data-id="${echap(b.id)}">
      <div class="ic">${c.icone}</div>${echap(nomBloc(b))}<div class="st">${echap(resume(b))}</div></div>`;
  }
  h += '<button class="plus" id="ajout" aria-label="Ajouter un bloc">+</button><div class="io" id="ioOut">OUT</div><div class="fil"></div>';
  r.innerHTML = h;
  majEcretage();
  const fil = r.querySelector(".fil");
  fil.style.width = Math.max(0, r.scrollWidth - 60) + "px";
  r.scrollLeft = sc;
  $("aide").textContent = T.chaine.length ? "Toucher : régler · appui long puis glisser : déplacer · + : ajouter" : "";
}

let clicIgnoreJusqua = 0;
document.addEventListener("click", ev => {
  if (performance.now() < clicIgnoreJusqua) { ev.stopPropagation(); ev.preventDefault(); }
}, true);

/* Toucher = sélectionner ; glisser = faire défiler ; appui long = déplacer */
(function gestesChaine() {
  const r = $("rangee");
  let g = null;
  r.addEventListener("pointerdown", ev => {
    const blk = ev.target.closest(".blk");
    g = {x: ev.clientX, y: ev.clientY, sc: r.scrollLeft, blk, mode: "?", id: ev.pointerId};
    occupe++;
    if (blk) g.timer = setTimeout(() => commencerGlisse(blk), 380);
  });
  r.addEventListener("pointermove", ev => {
    if (!g || ev.pointerId !== g.id) return;
    const dx = ev.clientX - g.x;
    if (g.mode === "?" && Math.abs(dx) > 8) { g.mode = "defile"; clearTimeout(g.timer); r.setPointerCapture(ev.pointerId); }
    if (g.mode === "defile") r.scrollLeft = g.sc - dx;
    if (g.mode === "glisse") deplacerGlisse(ev.clientX);
  });
  const fin = ev => {
    if (!g || ev.pointerId !== g.id) return;
    clearTimeout(g.timer);
    const m = g.mode, blk = g.blk; g = null; occupe = Math.max(0, occupe - 1);
    if (m === "glisse") finirGlisse(ev.type === "pointercancel");
    else if (m === "?" && ev.type === "pointerup") {
      if (blk) { choisir(blk.dataset.id); }
      else if (ev.target.closest("#ajout")) {
        // Au toucher, le navigateur envoie un « clic » juste après : il tomberait
        // sur la fenêtre qui vient de s'ouvrir sous le doigt et ajouterait un bloc.
        clicIgnoreJusqua = performance.now() + 500;
        feuilleAjout();
      }
    }
    if (!occupe && aRedessiner) redessiner();
  };
  r.addEventListener("pointerup", fin);
  r.addEventListener("pointercancel", fin);

  let gl = null;
  function commencerGlisse(blk) {
    if (!g) return;
    g.mode = "glisse"; r.setPointerCapture(g.id);
    const blocs = [...r.querySelectorAll(".blk")];
    gl = {blk, blocs, depart: blocs.indexOf(blk), x0: g.x, centres: blocs.map(b => { const q = b.getBoundingClientRect(); return q.left + q.width / 2; }),
          largeur: blk.getBoundingClientRect().width + 12, cible: blocs.indexOf(blk)};
    blk.classList.add("glisse");
    if (navigator.vibrate) navigator.vibrate(20);
  }
  function deplacerGlisse(x) {
    if (!gl) return;
    const dx = x - gl.x0;
    gl.blk.style.transform = `translateX(${dx}px) scale(1.05)`;
    const pos = gl.centres[gl.depart] + dx;
    let cible = 0;
    gl.centres.forEach((c, i) => { if (i !== gl.depart && pos > c) cible++; });
    gl.cible = cible;
    gl.blocs.forEach((b, i) => {
      if (i === gl.depart) return;
      let d = 0;
      if (gl.depart < cible && i > gl.depart && i <= cible) d = -gl.largeur;
      if (gl.depart > cible && i < gl.depart && i >= cible) d = gl.largeur;
      b.style.transform = d ? `translateX(${d}px)` : "";
    });
    const q = r.getBoundingClientRect();     // défilement près des bords
    if (x < q.left + 40) r.scrollLeft -= 8; else if (x > q.right - 40) r.scrollLeft += 8;
  }
  async function finirGlisse(annule) {
    if (!gl) return;
    const {depart, cible} = gl; gl = null;
    if (annule || depart === cible) { redessiner(); return; }
    const ordre = T.chaine.map(b => b.id);
    const [x] = ordre.splice(depart, 1); ordre.splice(cible, 0, x);
    const [b] = T.chaine.splice(depart, 1); T.chaine.splice(cible, 0, b);
    sel = x; redessiner();
    await action("/api/ordre", {ordre});
    maj(true);
  }
})();

function choisir(id) { sel = id; dessinerChaine(); dessinerPanneau(); }

/* ---------- Panneau de réglages ---------- */
function blocSel() { return T && T.chaine.find(b => b.id === sel); }

function dessinerPanneau() {
  const p = $("panneau");
  if (!T || !C) return;
  const b = blocSel();
  if (!b) {
    p.innerHTML = `<div class="videmsg">${T.chaine.length ? "Touchez un bloc pour le régler" :
      "La chaîne est vide.<br>Touchez <b>+</b> pour ajouter un effet ou un NAM."}</div>`;
    return;
  }
  const c = cfgType(b.type);
  if (!c) { p.innerHTML = `<div class="videmsg">Bloc ${echap(b.id)} non géré par l'interface</div>`; return; }
  const modele = c.params.find(q => q.type === "fichier");
  const listes = c.params.filter(q => q.type === "liste");
  let h = `<div id="ptete"><div id="ptitre">${echap(c.nom)}${b.id.includes("_") ? " " + echap(b.id.split("_")[1]) : ""}`;
  if (modele) h += `<button class="mod" id="choixModele">${echap(b.type === "NAM" ? nomAffiche(valeur(b, modele.nom)) || "Choisir un modèle…" :
    valeur(b, modele.nom) || "Choisir une IR…")} ▾</button>`;
  h += `</div>`;
  for (const q of listes) {
    h += `<span class="seg" data-liste="${echap(q.nom)}">` + q.valeurs.map((v, i) =>
      `<button class="${valeur(b, q.nom) === v ? "on" : ""}" data-v="${echap(v)}">${echap(q.libelles[i])}</button>`).join("") + `</span>`;
  }
  const ccA = ccDe({cible: "actif", id: b.id});
  h += `<button id="midiBloc">MIDI</button>
        <button class="bascule ${b.actif ? "on" : ""}" id="bypass">${b.actif ? "Activé" : "Bypass"}${ccA}</button>
        <button class="danger" id="retirer" aria-label="Retirer le bloc">Retirer</button></div><div id="boutons">`;
  for (const q of c.params) {
    if (q.type === "bouton" || q.type === "entier") h += bouton(b, q);
    else if (q.type === "interrupteur") {
      const on = +valeur(b, q.nom) ? 1 : 0;
      h += `<div class="inter"><button class="bascule ${on ? "on" : ""}" data-inter="${echap(q.nom)}">${on ? "Oui" : "Non"}</button><div class="lib">${echap(q.libelle)}</div></div>`;
    }
  }
  h += `</div>`;
  p.innerHTML = h;
  p.querySelector("#bypass").onclick = () => basculer(b);
  p.querySelector("#midiBloc").onclick = () => feuilleMidiBloc(b);
  p.querySelector("#retirer").onclick = () => retirer(b);

    envoyerParam(b, bt.dataset.inter, (+valeur(b, bt.dataset.inter)) ? 0 : 1, true); dessinerPanneau();
  });
  p.querySelectorAll(".k").forEach(k => gesteBouton(k, b, c.params.find(q => q.nom === k.dataset.nom)));

function arc(frac) {
  // Arc de 270° (de -225° à +45°), en SVG
  const R = 34, cx = 41, cy = 41, a0 = -225 * Math.PI / 180, a1 = a0 + Math.max(0.001, frac) * 1.5 * Math.PI;
  const p = a => [cx + R * Math.cos(a), cy + R * Math.sin(a)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1), [xe, ye] = p(a0 + 1.5 * Math.PI);
  const grand = (a1 - a0) > Math.PI ? 1 : 0;
  // Épaisseurs et couleurs prises dans le thème (variables CSS)
  return `<path d="M${x0} ${y0} A${R} ${R} 0 1 1 ${xe} ${ye}" style="stroke:var(--piste,#2c3038);stroke-width:var(--piste-ep,7)" fill="none" stroke-linecap="round"/>
    <path d="M${x0} ${y0} A${R} ${R} 0 ${grand} 1 ${x1} ${y1}" style="stroke:var(--accent);stroke-width:var(--arc,7)" fill="none" stroke-linecap="round"/>
    <circle class="fondk" cx="41" cy="41" r="25" fill="transparent" stroke="transparent" stroke-width="1.5"/>`;
}
function fraction(q, v) { return q.max > q.min ? (Math.min(q.max, Math.max(q.min, +v)) - q.min) / (q.max - q.min) : 0; }
function bouton(b, q) {
  const v = valeur(b, q.nom);
  return `<div class="k${q.avance ? " av" : ""}" data-nom="${echap(q.nom)}" title="${echap(q.description)}">
    <svg viewBox="0 0 82 82">${arc(fraction(q, v))}</svg><div class="val">${echap(fmt(q, v))}</div><div class="lib">${echap(q.libelle)}${ccDe({cible: "param", id: b.id, nom: q.nom})}</div></div>`;
}
function majBouton(k, q, v) {
  k.querySelector("svg").innerHTML = arc(fraction(q, v));
  k.querySelector(".val").textContent = fmt(q, v);
}
/* Glisser vers le haut ou la droite = augmenter ; double toucher = valeur par défaut */
function gesteBouton(k, b, q) {
  let g = null, dernierTap = 0;
  k.addEventListener("pointerdown", ev => {
    k.setPointerCapture(ev.pointerId);
    g = {x: ev.clientX, y: ev.clientY, v0: +valeur(b, q.nom), bouge: false};
    occupe++; k.classList.add("actif");
  });
  k.addEventListener("pointermove", ev => {
    if (!g) return;
    const d = (ev.clientX - g.x) - (ev.clientY - g.y);
    if (Math.abs(d) > 3) g.bouge = true;
    if (!g.bouge) return;
    let v = g.v0 + d / 220 * (q.max - q.min);
    v = Math.min(q.max, Math.max(q.min, v));
    if (q.type === "entier") v = Math.round(v);
    majBouton(k, q, v);
    envoyerParam(b, q.nom, v);
  });
  const fin = ev => {
    if (!g) return;
    const bouge = g.bouge; g = null; occupe = Math.max(0, occupe - 1); k.classList.remove("actif");
    if (!bouge && ev.type === "pointerup") {
      const t = Date.now();
      if (t - dernierTap < 350) { majBouton(k, q, q.defaut); envoyerParam(b, q.nom, q.defaut, true); }
      dernierTap = t;
    }
    dessinerChaine();
    if (!occupe && aRedessiner) redessiner();
  };
  k.addEventListener("pointerup", fin);
  k.addEventListener("pointercancel", fin);
}

/* Envoi des réglages : au plus un toutes les 100 ms (250 ms en Bluetooth) par réglage */
const envois = {};
function envoyerParam(b, nom, v, immediat) {
  const cle = b.id + "|" + nom;
  locales[cle] = {v, t: Date.now()};
  b.valeurs[nom] = v;
  const e = envois[cle] || (envois[cle] = {});
  e.v = v;
  if (e.timer && !immediat) { e.attente = true; return; }
  const partir = async () => {
    e.attente = false;
    await action("/api/param", {id: b.id, nom, valeur: e.v});
    locales[cle] = {v: e.v, t: Date.now()};
  };
  partir();
  clearTimeout(e.timer);
  e.timer = setTimeout(function suite() {
    if (e.attente) { partir(); e.timer = setTimeout(suite, BLE() ? 250 : 100); } else e.timer = null;
  }, BLE() ? 250 : 100);
}

const RANGEES = ["azertyuiop", "qsdfghjklm", "wxcvbn-_'", "1234567890"];
const SYMBOLES = ["!@#$%&*()?", "+=/\\:;\"<>,.", "[]{}~^|`€£", "1234567890"];
/* Saisie au clavier de l'écran (o.mdp : mot de passe Wi-Fi, majuscules au choix,
   touche des symboles, 63 caractères) */
function demanderNom(titre, defaut, si, o = {}) {
  const max = o.mdp ? 63 : 40;
  let h = (o.texte ? `<div style="margin-bottom:8px">${o.texte}</div>` : "") +
    `<input class="champ" id="nchamp" maxlength="${max}" value="${echap(defaut)}" ${ECRAN ? "readonly" : ""} autocomplete="off"` +
    (o.mdp ? ` autocapitalize="off" spellcheck="false"` : "") + `>`;
  if (ECRAN) h += `<div class="clavier" id="nclavier"></div>`;
  h += `<div class="boutonsfin"><button id="nnon">Annuler</button><button class="prim" id="noui">${echap(o.bouton || "Enregistrer")}</button></div>`;
  const f = ouvrir(titre, h), champ = f.querySelector("#nchamp");
  let maj_ = !o.mdp, sym = false;
  const dessiner = () => {
    const k = f.querySelector("#nclavier"); if (!k) return;
    k.innerHTML = (sym ? SYMBOLES : RANGEES).map(r => `<div>${[...r].map(c => {
      const t = !sym && maj_ ? c.toUpperCase() : c;
      return `<button data-c="${echap(t)}">${echap(t)}</button>`; }).join("")}</div>`).join("") +
      `<div><button class="moyen" data-c="MAJ">${maj_ ? "⇧ MAJ" : "⇧"}</button>` +
      (o.mdp ? `<button class="moyen" data-c="SYM">${sym ? "abc" : "#+="}</button>` : "") +
      `<button class="large" data-c=" ">espace</button><button class="moyen" data-c="EFF">⌫</button></div>`;
    k.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
      const c = b.dataset.c;
      if (c === "MAJ") { maj_ = !maj_; sym = false; return dessiner(); }
      if (c === "SYM") { sym = !sym; return dessiner(); }
      if (c === "EFF") champ.value = champ.value.slice(0, -1);
      else if (champ.value.length < max) {
        champ.value += c;
        if (maj_ && !o.mdp) { maj_ = false; dessiner(); }
      }
    });
  };
  dessiner();
  if (!ECRAN) setTimeout(() => champ.focus(), 50);
  f.querySelector("#nnon").onclick = o.annuler || fermer;
  const ok = () => {
    const v = o.mdp ? champ.value : champ.value.trim();
    if (!v && !o.vide) return message(o.mdp ? "Tapez le mot de passe" : "Donnez un nom");
    if (o.mdp && v.length < 8) return message("8 caractères minimum");
    fermer(); si(v);
  };
  f.querySelector("#noui").onclick = ok;
  champ.onkeydown = ev => { if (ev.key === "Enter") ok(); };
}

function barres(signal) {
  const n = signal >= 70 ? 4 : signal >= 50 ? 3 : signal >= 30 ? 2 : 1;
  return `<span class="wbarres">${[1, 2, 3, 4].map(i => `<i class="${i <= n ? "on" : ""}" style="height:${4 + i * 3}px"></i>`).join("")}</span>`;
}
function texteWifi(w) {
  if (!w || w.absent) return "Pas de Wi-Fi sur cette machine";
  const l = [];
  if (w.ssid) l.push(`Connecté à <b>${echap(w.ssid)}</b>${w.ip ? " · " + echap(w.ip) : ""}`);
  else if (w.hotspot) l.push(`Réseau de la tête <b>${echap(w.hotspot_nom || "TeteNAM")}</b> actif${w.ip ? " · " + echap(w.ip) : ""}`);
  else l.push("Wi-Fi : aucune connexion");
  if (w.cable) l.push("câble réseau branché");
  return l.join(" · ");
}
let wifiTimer = null;
async function feuilleWifi() {
  const f = ouvrir("Wi-Fi", `<div id="wetat" class="wetat">Lecture…</div><div id="wres"></div>
    <div class="rangs" style="margin-top:8px"><button id="wcherche">Rechercher</button><button id="whot">Réseau de la tête</button></div>

    <div class="pied">Si la page est ouverte par le Wi-Fi, elle se coupe pendant le changement : retrouvez-la ensuite sur http://tetenam.local:8080 depuis le nouveau réseau.</div>`);
  let w = null, cherche = false;
  const dessinerW = () => {
    if (!$("wetat")) return;
    $("wetat").innerHTML = texteWifi(w);
    const r = w && w.resultat;
    const recent = r && Date.now() / 1000 - r.t < 120;
    $("wres").innerHTML = recent ? `<div class="wres ${r.etat}">${echap(r.message)}</div>` : "";
    if (!w || w.absent) { $("wliste").innerHTML = ""; return; }
    $("wliste").innerHTML = (w.reseaux || []).length ? w.reseaux.map((n, i) =>
      `<div class="ligne wligne"><button data-i="${i}" class="${n.actif ? "courant" : ""}">${barres(n.signal)}
        <span class="wnom">${echap(n.ssid)}</span><span class="wtags">${n.actif ? "connecté" : n.connu ? "enregistré" : ""}${n.securise ? " 🔒" : ""}</span></button>
        ${n.connu ? `<button class="danger" data-oubli="${i}">Oublier</button>` : ""}</div>`).join("")
      : `<div class="videmsg">${cherche ? "Recherche des réseaux…" : "Aucun réseau trouvé. Touchez « Rechercher »."}</div>`;
    $("wliste").querySelectorAll("[data-i]").forEach(bt => bt.onclick = () => choisirReseau(w.reseaux[+bt.dataset.i]));
    $("wliste").querySelectorAll("[data-oubli]").forEach(bt => bt.onclick = () => {
      const n = w.reseaux[+bt.dataset.oubli];
      confirmer(`Oublier le réseau « ${n.ssid} » ? Son mot de passe sera effacé de la tête.`, "Oublier", async () => {
        await action("/api/wifi", {action: "oublier", ssid: n.ssid}); feuilleWifi();
      });
    });
  };
  const lire = async () => { try { w = await api("/api/wifi"); } catch (e) { /* page coupée pendant la bascule */ } dessinerW(); };
  const chercher = async () => {
    cherche = true; $("wcherche").disabled = true; $("wcherche").textContent = "Recherche…"; dessinerW();
    await action("/api/wifi", {action: "chercher"});
    cherche = false; if ($("wcherche")) { $("wcherche").disabled = false; $("wcherche").textContent = "Rechercher"; }
    await lire();
  };
  f.querySelector("#wcherche").onclick = chercher;
  f.querySelector("#whot").onclick = () => confirmer("Passer sur le réseau Wi-Fi créé par la tête ? Le Wi-Fi actuel est quitté.", "Passer", async () => {
    await action("/api/wifi", {action: "hotspot"}); message("Bascule sur le réseau de la tête…", true); feuilleWifi();
  });
  await lire();
  if (w && !w.absent) chercher();
  clearInterval(wifiTimer);
  wifiTimer = setInterval(() => { if (!$("wetat")) return clearInterval(wifiTimer); if (!cherche) lire(); }, 3000);
}
function choisirReseau(n) {

function graphe(c, h) {
  const x = c.getContext("2d"), w = c.width = c.clientWidth * devicePixelRatio, ht = c.height = 70 * devicePixelRatio;
  x.clearRect(0, 0, w, ht);
  x.strokeStyle = "#333"; x.beginPath(); [70, 85].forEach(s => { const y = ht - s / 100 * ht; x.moveTo(0, y); x.lineTo(w, y); }); x.stroke();
  x.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#ffb547";
  x.lineWidth = 2 * devicePixelRatio; x.beginPath();
  let premier = true;
  h.forEach((v, i) => { if (v == null) { premier = true; return; } const px = i / 119 * w, py = ht - Math.min(v, 100) / 100 * ht; premier ? x.moveTo(px, py) : x.lineTo(px, py); premier = false; });
  x.stroke();
}

/* ---------- Veille de l'écran de la tête ----------
   Sans toucher l'écran pendant VEILLE secondes (7 par défaut, page Système),
   il n'affiche plus que le logo et une onde qui suit le son en sortie. Un
   changement de preset (au pied) affiche son nom 3 s à la place de l'onde.
   Le premier toucher ne fait que réveiller l'écran. */
const VEILLE_ICI = ECRAN || new URLSearchParams(location.search).has("veille");
const V = {endormi: false, dernier: Date.now(), cle: null, minuteur: null, niveau: null,
           env: 0, grave: 0, aigu: 0, crete: 0, t: 0, avant: 0, bandes: new Array(24).fill(0), cretes: null};
function styleVeille() { return T && T.reglages && T.reglages.VEILLE_STYLE === "spectre" ? "spectre" : "onde"; }
/* Spectre : les graves à gauche, les aigus à droite (24 bandes de tiers
   d'octave, 63 Hz à 12,7 kHz). Une ligne dorée nette monte depuis le bas,
   avec un léger voile dessous et un repère de crête qui retombe doucement. */
function dessinerSpectre(g, W, H) {
  const N = V.bandes.length, base = H - 2, haut = H * 0.92, or = "214,172,90";
  if (!V.cretes || V.cretes.length !== N) V.cretes = new Array(N).fill(0);
  const dtc = 1 / 60;
  for (let i = 0; i < N; i++) V.cretes[i] = Math.max(V.bandes[i], V.cretes[i] - dtc * 0.35);
  // Courbe de Catmull-Rom : passe exactement par chaque bande, sans paliers
  const val = (tab, u) => {
    const p = Math.max(0, Math.min(N - 1, u * (N - 1))), i = Math.floor(p), f = p - i;
    const v = k => tab[Math.max(0, Math.min(N - 1, k))];
    const a = v(i - 1), b = v(i), c = v(i + 1), d = v(i + 2);
    return Math.max(0, Math.min(1, b + 0.5 * f * (c - a + f * (2 * a - 5 * b + 4 * c - d + f * (3 * (b - c) + d - a)))));
  };
  const marge = 0.05, pas = 2;
  const pts = tab => {
    const r = [];
    for (let x = 0; x <= W; x += pas) {
      const u = x / W, e = Math.min(1, Math.min(u, 1 - u) / marge), bord = e * e * (3 - 2 * e);
      r.push([x, base - haut * (0.012 + Math.pow(val(tab, u), 1.6)) * bord]);
    }
    return r;
  };
  const ligne = pts(V.bandes);
  // Voile sous la ligne
  g.beginPath(); g.moveTo(0, base);
  ligne.forEach(([x, y]) => g.lineTo(x, y));
  g.lineTo(W, base); g.closePath();
  const voile = g.createLinearGradient(0, base - haut, 0, base);
  voile.addColorStop(0, `rgba(${or},${0.22 + 0.15 * V.env})`); voile.addColorStop(1, `rgba(${or},0.02)`);
  g.fillStyle = voile; g.fill();
  // Ligne de base fine
  g.globalAlpha = 0.35; g.fillStyle = `rgb(${or})`; g.fillRect(W * marge, base, W * (1 - 2 * marge), 1);
  // Repère de crête : fil fin qui retombe lentement
  g.lineJoin = g.lineCap = "round";
  g.beginPath(); pts(V.cretes).forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
  g.globalAlpha = 0.35; g.strokeStyle = "rgb(240,213,143)"; g.lineWidth = 1; g.stroke();
  // Ligne principale
  g.beginPath(); ligne.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
  g.globalAlpha = 1; g.lineWidth = 2;
  g.shadowColor = `rgba(${or},${0.45 + 0.4 * V.crete})`; g.shadowBlur = 6 + 8 * V.crete;
  g.stroke();
  g.globalAlpha = 1; g.shadowBlur = 0;
}
function delaiVeille() { const d = T && T.reglages ? T.reglages.VEILLE : undefined; return d == null ? 7 : +d; }
function peutDormir() {
  return E && E.moteur && !$("demarrage").classList.contains("ouvert") && !$("accord").classList.contains("ouvert") &&
    !apprentissage && !occupe && !t3Ouverte();       // pas de veille sur la fenêtre TONE3000 (QR code, essai)
}
["pointerdown", "touchstart", "keydown", "wheel"].forEach(t =>
  document.addEventListener(t, () => { V.dernier = Date.now(); }, {capture: true, passive: true}));
if (VEILLE_ICI) setInterval(() => {
  const d = delaiVeille();
  if (!V.endormi && d > 0 && Date.now() - V.dernier > d * 1000 && peutDormir()) endormir();
}, 500);
function endormir() {
  V.endormi = true; V.cle = cleHaut(); V.env = V.grave = V.aigu = V.crete = 0;
  const v = $("veille"); v.classList.remove("reveil", "preset"); v.classList.add("ouvert");
  requestAnimationFrame(() => v.classList.add("visible"));
  V.avant = performance.now(); requestAnimationFrame(dessinerOnde);

function reveiller() {

/* Niveau linéaire -> 0..1 sur une échelle en dB (-54 à -6 dBFS) */

  const n = V.niveau || {};

  V.grave = lisser(V.grave, versUn(n.grave), dt);
  V.aigu = lisser(V.aigu, versUn(n.aigu), dt);
  V.crete = lisser(V.crete, versUn(n.crete), dt);

  // (naturellement plus faibles) se voient autant que les graves
  const b = n.bandes || [];
  // (échelle plus serrée que l'onde, -42 à -6 dB, pour bien voir la forme du spectre)
  for (let i = 0; i < V.bandes.length; i++) {
    const db = 20 * Math.log10((b[i] || 0) * Math.pow(10, i / 20) + 1e-6);   // +1 dB par tiers d'octave
    V.bandes[i] = lisser(V.bandes[i], Math.max(0, Math.min(1, (db + 48) / 40)), dt);
  }

  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const aGrave = ampl * (souffle + 0.9 * V.grave * V.env + 0.25 * V.env);

  const courbe = (k, signe) => {

    for (let x = 0; x <= W; x += 3) {

  const trace = pts => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); };

  const haut = courbe(0, 1), bas = courbe(0, -1);
  g.beginPath(); haut.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
  for (let i = bas.length - 1; i >= 0; i--) g.lineTo(bas[i][0], bas[i][1]);
  g.closePath();
  const voile = g.createLinearGradient(0, milieu - ampl, 0, milieu + ampl);
  voile.addColorStop(0, `rgba(${or},0)`); voile.addColorStop(0.5, `rgba(${or},${0.10 + 0.18 * V.env})`); voile.addColorStop(1, `rgba(${or},0)`);
  g.fillStyle = voile; g.fill();
  // Trois fils dorés, le premier lumineux
  const fond = g.createLinearGradient(0, 0, W, 0);
  fond.addColorStop(0, `rgba(${or},0)`); fond.addColorStop(0.2, `rgba(240,213,143,1)`);
  fond.addColorStop(0.8, `rgba(240,213,143,1)`); fond.addColorStop(1, `rgba(${or},0)`);
  g.lineCap = g.lineJoin = "round";
  for (let k = 2; k >= 0; k--) {

    g.strokeStyle = fond;
    g.globalAlpha = k === 0 ? 0.95 : 0.35 - 0.1 * k;
    g.lineWidth = k === 0 ? 2.4 : 1.4;
    g.shadowColor = `rgba(${or},${0.5 + 0.5 * V.crete})`;

/* ---------- QR code ---------- */
/* QR code (octets, correction M, versions 1 à 20), d'après le générateur de
   Project Nayuki (licence MIT, https://www.nayuki.io/page/qr-code-generator-library).
   qrMatrice(texte) -> tableau de lignes de booléens (true = module sombre). */
function qrMatrice(texte) {
  const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26];
  const BLOCS = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16];
  const donnees = [...new TextEncoder().encode(texte)];
  const brut = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const n = (v / 7 | 0) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; };
  const utiles = v => (brut(v) >> 3) - ECC[v] * BLOCS[v];
  let v = 1;
  while (4 + (v < 10 ? 8 : 16) + 8 * donnees.length > utiles(v) * 8) if (++v > 20) throw new Error("Texte trop long pour le QR code");
  // Suite de bits : mode octet, longueur, données, fin, bourrage
  const bits = [];
  const ajout = (x, n) => { for (let i = n - 1; i >= 0; i--) bits.push((x >>> i) & 1); };
  ajout(4, 4); ajout(donnees.length, v < 10 ? 8 : 16); donnees.forEach(o => ajout(o, 8));
  const cap = utiles(v) * 8;
  ajout(0, Math.min(4, cap - bits.length)); ajout(0, (8 - bits.length % 8) % 8);
  for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) ajout(p, 8);
  const mots = []; for (let i = 0; i < bits.length; i += 8) mots.push(bits.slice(i, i + 8).reduce((a, b) => a << 1 | b, 0));
  // Reed-Solomon et entrelacement
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
  const deg = ECC[v], div = new Array(deg).fill(0); div[deg - 1] = 1;
  for (let i = 0, r = 1; i < deg; i++) { for (let j = 0; j < deg; j++) { div[j] = mul(div[j], r); if (j + 1 < deg) div[j] ^= div[j + 1]; } r = mul(r, 2); }
  const reste = d => { const r = new Array(deg).fill(0); for (const b of d) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => r[i] ^= mul(c, f)); } return r; };
  const nb = BLOCS[v], tot = brut(v) >> 3, courts = nb - tot % nb, lc = (tot / nb) | 0, blocs = [];
  for (let i = 0, k = 0; i < nb; i++) {
    const d = mots.slice(k, k + lc - deg + (i < courts ? 0 : 1)); k += d.length;
    const e = reste(d); if (i < courts) d.push(0); blocs.push(d.concat(e));
  }
  const tout = [];
  for (let i = 0; i < blocs[0].length; i++) blocs.forEach((b, j) => { if (i !== lc - deg || j >= courts) tout.push(b[i]); });
  // Motifs fixes
  const n = v * 4 + 17, m = [...Array(n)].map(() => Array(n).fill(false)), fx = [...Array(n)].map(() => Array(n).fill(false));
  const fixe = (x, y, s) => { m[y][x] = s; fx[y][x] = true; };
  for (let i = 0; i < n; i++) { fixe(6, i, i % 2 === 0); fixe(i, 6, i % 2 === 0); }
  const reperes = (x, y) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
    const d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy;
    if (xx >= 0 && xx < n && yy >= 0 && yy < n) fixe(xx, yy, d !== 2 && d !== 4); } };
  reperes(3, 3); reperes(n - 4, 3); reperes(3, n - 4);
  if (v > 1) {
    const na = (v / 7 | 0) + 2, pas = ((v * 4 + na * 2 + 1) / (na * 2 - 2) | 0) * 2, pos = [6];
    for (let i = 0, p = n - 7; i < na - 1; i++, p -= pas) pos.splice(1, 0, p);
    pos.forEach((a, i) => pos.forEach((b, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) fixe(a + dx, b + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);

    for (let i = 9; i < 15; i++) fixe(14 - i, 8, bit(i));
    for (let i = 0; i < 8; i++) fixe(n - 1 - i, 8, bit(i));
    for (let i = 8; i < 15; i++) fixe(8, n - 15 + i, bit(i));

  }

    if (droite === 6) droite = 5;

      if (!fx[y][x] && k < tout.length * 8) { m[y][x] = ((tout[k >> 3] >>> (7 - (k & 7))) & 1) === 1; k++; }
    }

  // Masque : le moins pénalisé des 8
  const inverse = (q, x, y) => [(x + y) % 2, y % 2, x % 3, (x + y) % 3, ((x / 3 | 0) + (y / 2 | 0)) % 2,
    x * y % 2 + x * y % 3, (x * y % 2 + x * y % 3) % 2, ((x + y) % 2 + x * y % 3) % 2][q] === 0;
  const masquer = q => { for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!fx[y][x] && inverse(q, x, y)) m[y][x] = !m[y][x]; };
  const penalite = () => {
    let r = 0;
    const ligne = get => {
      for (let a = 0; a < n; a++) {
        let coul = false, long = 0; const h = [0, 0, 0, 0, 0, 0, 0];
        const hist = l => { if (h[0] === 0) l += n; h.pop(); h.unshift(l); };
        const motif = () => { const c = h[1], cur = c > 0 && h[2] === c && h[3] === c * 3 && h[4] === c && h[5] === c;
          return (cur && h[0] >= c * 4 && h[6] >= c ? 1 : 0) + (cur && h[6] >= c * 4 && h[0] >= c ? 1 : 0); };
        for (let b = 0; b < n; b++) {
          if (get(a, b) === coul) { long++; if (long === 5) r += 3; else if (long > 5) r++; }
          else { hist(long); if (!coul) r += motif() * 40; coul = get(a, b); long = 1; }
        }
        if (coul) { hist(long); long = 0; }
        long += n; hist(long); r += motif() * 40;
      }
    };
    ligne((a, b) => m[a][b]); ligne((a, b) => m[b][a]);
    let sombres = 0;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      if (m[y][x]) sombres++;
      if (y < n - 1 && x < n - 1 && m[y][x] === m[y][x + 1] && m[y][x] === m[y + 1][x] && m[y][x] === m[y + 1][x + 1]) r += 3;
    }
    const t = n * n; r += (Math.ceil(Math.abs(sombres * 20 - t * 10) / t) - 1) * 10;

/* Le QR code en SVG (marge de 4 modules, fond blanc pour la lecture) */
function qrSvg(texte, taille) {
  const m = qrMatrice(texte), n = m.length, c = n + 8;
  let d = "";
  m.forEach((l, y) => l.forEach((s, x) => { if (s) d += `M${x + 4},${y + 4}h1v1h-1z`; }));

    `<rect width="${c}" height="${c}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;

/* ---------- Bibliothèque des modèles ----------

let B = null, cleBib = "";

function nomAffiche(f) {
  if (!f) return "";
  if (B && B.essai && B.essai.fichier === f) return "Essai · " + B.essai.nom;
  if (f.startsWith("_essai-")) return "Essai TONE3000";

/* Clavier de l'écran pour une recherche : change(texte, fini) à chaque touche */
function clavierRecherche(el, champ, change) {
  const R = ["1234567890", "azertyuiop", "qsdfghjklm", "wxcvbn-'."];
  el.innerHTML = R.map(r => `<div>${[...r].map(c => `<button data-c="${echap(c)}">${echap(c)}</button>`).join("")}</div>`).join("") +
    `<div><button class="moyen" data-c="VIDER">Vider</button><button class="large" data-c=" ">espace</button>` +
    `<button class="moyen" data-c="EFF">⌫</button><button class="moyen prim" data-c="OK">OK</button></div>`;
  el.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    const c = b.dataset.c;
    if (c === "OK") return change(champ.value, true);
    champ.value = c === "EFF" ? champ.value.slice(0, -1) : c === "VIDER" ? "" : (champ.value + c).slice(0, 60);
    change(champ.value, false);
  });
}
/* Champ de recherche : clavier de l'écran sur la tête, clavier normal ailleurs */
function champRecherche(f, id, valeur, change, indice) {
  const zone = f.querySelector("#" + id);
  zone.innerHTML = `<input class="champ" id="${id}c" value="${echap(valeur)}" placeholder="${echap(indice)}" autocomplete="off" ${ECRAN ? "readonly" : ""}>
    ${ECRAN ? `<div class="clavier compact" id="${id}k" hidden></div>` : ""}`;
  const champ = zone.querySelector("input");
  if (ECRAN) {
    const k = zone.querySelector(".clavier");
    clavierRecherche(k, champ, (v, fini) => { if (fini) k.hidden = true; change(v, fini); });
    champ.onclick = () => { k.hidden = !k.hidden; };
  } else {
    champ.oninput = () => change(champ.value, false);
    champ.onkeydown = ev => { if (ev.key === "Enter") change(champ.value, true); };
  }
  return champ;
}

const filtreBib = {texte: "", etiq: "", type: "", fav: false};
function modelesFiltres() {
  const mots = plat(filtreBib.texte).split(/\s+/).filter(Boolean);
  return (B ? B.modeles : []).filter(m => {
    const t = m.t3k || {};
    if (filtreBib.fav && !m.favori) return false;
    if (filtreBib.etiq && !m.etiquettes.includes(filtreBib.etiq)) return false;
    if (filtreBib.type === "fichier" ? m.source !== "fichier" : filtreBib.type && t.gear !== filtreBib.type) return false;
    if (!mots.length) return true;
    const foin = plat([m.nom, m.fichier, t.tone, t.modele, t.createur, t.pseudo, GEARS[t.gear], ...(t.makes || []),
                       ...(t.tags || []), ...m.etiquettes].join(" "));
    return mots.every(x => foin.includes(x));
  }).sort((a, b) => (b.favori - a.favori) || a.nom.localeCompare(b.nom, "fr"));
}

        <span class="betq">${m.etiquettes.map(e => `<i>${echap(e)}</i>`).join("")}</span></button>
        <button class="bedit" data-e="${echap(m.fichier)}" aria-label="Fiche du modèle">✎</button></div>`;
