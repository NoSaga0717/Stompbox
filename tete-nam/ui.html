    z.querySelectorAll("[data-e]").forEach(b => b.onclick = () => feuilleFiche(b.dataset.e, () => feuilleBibliotheque(o)));
  };
  puces(); liste();
  const env = f.querySelector("#benvoi"); if (env) env.onclick = envoyerFichiers;
  // Depuis « + » : ce qu'on essaie sur TONE3000 va dans un nouveau bloc NAM
  f.querySelector("#bt3k").onclick = () => feuilleT3K(o.ajout ? {apres: sel} : null);
}

/* Fiche d'un modèle : étiquettes, favori, nom affiché, suppression */
function feuilleFiche(fichier, retour) {
  const m = B && B.modeles.find(x => x.fichier === fichier);
  if (!m) return retour();
  const t = m.t3k;
  const f = ouvrir("Fiche du modèle", `<div class="fiche"><div class="fimg">${vignette(t && t.image)}</div><div>
      <div class="fnom">${echap(m.nom)}</div>
      ${t ? `${m.renomme ? `<div>${echap(t.tone)} · ${echap(t.modele)}</div>` : ""}
        <div class="doux">${echap([t.createur, GEARS[t.gear], ...(t.makes || [])].filter(Boolean).join(" · "))}</div>
        <div class="doux">${logoT3K(true)} ${t.taille ? echap(t.taille) + " · " : ""}${t.licence ? "licence " + echap(t.licence) : ""}</div>`
        : `<div class="doux">Fichier envoyé à la tête</div>`}
      <div class="doux">Fichier : ${echap(fichier)}.nam</div></div></div>
    <div class="etiq">Étiquettes : touchez pour ajouter ou enlever</div><div class="rangs" id="fetq"></div>
    <div class="rangs"><button id="ffav">${m.favori ? "★ Favori" : "☆ Mettre en favori"}</button><button id="fren">Renommer</button>
      <span style="flex:1"></span><button class="danger" id="fsup">Supprimer de la tête</button></div>
    <div class="boutonsfin"><button class="prim" id="fret">Terminé</button></div>`);
  const etq = () => {
    f.querySelector("#fetq").innerHTML = B.etiquettes.map(e =>
      `<button class="puce${m.etiquettes.includes(e) ? " on" : ""}" data-x="${echap(e)}">${echap(e)}</button>`).join("") +
      `<button class="puce" id="fnouv">+ Nouvelle étiquette</button>`;
    f.querySelectorAll("[data-x]").forEach(b => b.onclick = async () => {
      const x = b.dataset.x;
      m.etiquettes = m.etiquettes.includes(x) ? m.etiquettes.filter(y => y !== x) : [...m.etiquettes, x];
      etq();
      await action("/api/bibliotheque", {action: "etiqueter", fichier, etiquettes: m.etiquettes});
      relireBib();
    });
    f.querySelector("#fnouv").onclick = () => demanderNom("Nouvelle étiquette", "", async nom => {
      await action("/api/bibliotheque", {action: "etiqueter", fichier, etiquettes: [...m.etiquettes, nom]});
      await relireBib(); feuilleFiche(fichier, retour);
    }, {bouton: "Ajouter", annuler: () => feuilleFiche(fichier, retour)});
  };
  etq();
  f.querySelector("#ffav").onclick = async () => {
    await action("/api/bibliotheque", {action: "favori", fichier, favori: !m.favori});
    await relireBib(); feuilleFiche(fichier, retour);
  };
  f.querySelector("#fren").onclick = () => demanderNom("Nom affiché du modèle", m.nom, async nom => {
    await action("/api/bibliotheque", {action: "renommer", fichier, nom});
    await relireBib(); redessiner(); feuilleFiche(fichier, retour);
  }, {annuler: () => feuilleFiche(fichier, retour),
      texte: "Le fichier ne change pas : les presets qui utilisent ce modèle continuent de marcher."});
  f.querySelector("#fsup").onclick = async () => {
    const u = await action("/api/bibliotheque", {action: "utilisation", fichier});
    if (!u) return;
    if (u.chaine.length) return message("Ce modèle est dans la chaîne en cours : choisissez-en un autre d'abord");
    const p = u.presets.length ? ` Il est utilisé par ${u.presets.length > 1 ? "les presets" : "le preset"} « ${u.presets.join(" », « ")} » : ce bloc NAM n'aura plus de modèle.` : "";
    confirmer(`Supprimer « ${m.nom} » de la tête ?${p}`, "Supprimer", async () => {
      if (await action("/api/bibliotheque", {action: "supprimer", fichier})) message("Modèle supprimé", true);
      await relireBib(); await maj(true); retour();
    });
  };
  f.querySelector("#fret").onclick = retour;
}

/* ---------- TONE3000 ----------
   Connexion par QR code, recherche, favoris, téléchargés, tendances,
   nouveautés, fiche d'un tone, essai d'un modèle avant de le garder et
   téléchargement modèle par modèle (ou tout d'un coup). */
let T3 = null, t3Timer = null;
const t3 = {vue: "liste", onglet: "search", texte: "", gear: "", res: null, charge: false, erreur: "",
            tone: null, modeles: [], coches: new Set(), etiq: new Set(), qr: "", choixVu: 0};
const ONGLETS = [["search", "Recherche"], ["favorited", "Favoris"], ["downloaded", "Téléchargés"],
                 ["trending", "Tendances"], ["latest", "Nouveautés"], ["created", "Mes tones"]];
const AVEC_TEXTE = ["search", "favorited", "downloaded", "created"];
const t3Ouverte = () => !!$("t3k");
async function lireT3() { try { T3 = await api("/api/tone3000"); } catch (e) { T3 = null; } return T3; }

async function feuilleT3K(ajout) {
  t3.ajout = ajout || null;
  ouvrir("TONE3000", `<div id="t3k">Lecture…</div>`);
  await lireT3();
  if (t3.vue === "catalogue" || t3.vue === "connexion") t3.vue = "liste";
  dessinerT3K();
  if (T3 && T3.connecte && t3.vue === "liste" && !t3.res && t3.onglet !== "search") chercherT3(1);
  clearInterval(t3Timer);
  t3Timer = setInterval(async () => {
    if (!t3Ouverte()) return clearInterval(t3Timer);
    const avant = T3 ? T3.rev : -1, modeAvant = modeT3();
    await lireT3();
    if (!T3 || !t3Ouverte()) return;
    if (T3.choix && T3.choix.n !== t3.choixVu) {          // tone choisi sur le téléphone
      t3.choixVu = T3.choix.n; action("/api/tone3000", {action: "vu"});
      return ouvrirTone(T3.choix.tone_id);
    }
    if (T3.rev !== avant) {
      if (modeT3() !== modeAvant) return dessinerT3K();       // connexion faite, annulée, expirée…
      if (T3.tache && T3.tache.fini && t3.vue === "tone") { await relireBib(); dessinerT3K(); maj(true); return; }
      dessinerEtatT3();
    } else if (T3.connexion && T3.connexion.etat === "attente") {
      const r = $("t3reste"); if (r) r.textContent = minutes(T3.connexion.reste);
    }
  }, BLE() ? 2500 : 1200);
}
const modeT3 = () => !T3 ? "" : !T3.cle ? "cle" : T3.connecte ? "ok" : (T3.connexion ? T3.connexion.etat : "non");
const minutes = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

function dessinerT3K() {
  const z = $("t3k"); if (!z) return;
  if (!T3) { z.innerHTML = `<div class="videmsg">Pas de réponse de la tête.</div>`; return; }
  if (!T3.cle) {
    z.innerHTML = `<div class="t3tete">${logoT3K()}</div>
      <p style="line-height:1.5">Pour utiliser TONE3000, la tête a besoin de la clé de l'application. Elle se crée une seule fois sur
      tone3000.com → Settings → API Keys, et commence par <b>t3k_pub_</b> (jamais la clé secrète t3k_cs_).</p>
      <div class="boutonsfin"><button class="prim" id="t3cle">Entrer la clé…</button></div>`;
    z.querySelector("#t3cle").onclick = () => entrerCle(feuilleT3K);
    return;
  }
  const c = T3.connexion;
  if (!T3.connecte && (!c || c.etat === "annule")) {
    z.innerHTML = `<div class="t3tete">${logoT3K()}</div>
      <p style="line-height:1.5">Connectez la tête à votre compte TONE3000 pour chercher et télécharger des modèles NAM.
      Il suffit de scanner un QR code avec votre téléphone : rien à taper sur la tête. La tête doit être sur Internet (Wi-Fi).</p>
      <div class="boutonsfin"><button class="prim" id="t3go">Connecter la tête</button></div>`;
    z.querySelector("#t3go").onclick = async () => { if (await action("/api/tone3000", {action: "connecter"})) { await lireT3(); dessinerT3K(); } };
    return;
  }
  if (!T3.connecte) {                                   // code à valider sur le téléphone
    const fini = c.etat !== "attente";
    z.innerHTML = `<div class="t3tete">${logoT3K()}<b style="font-weight:400">Connexion de la tête</b></div>
      <div class="t3qr">${fini ? "" : qrSvg(c.url_complete, ECRAN ? 190 : 220)}
        <div class="t3etapes">${fini ? `<div class="wres echec">${echap(c.message)}</div>` :
          `1. Scannez le QR code avec votre téléphone,<br>ou ouvrez <b>${echap(c.url.replace(/^https?:\/\/(www\.)?/, ""))}</b><br>
           2. Vérifiez ce code :<div class="t3code">${echap(c.code)}</div>
           3. Validez : la tête se connecte toute seule.<br><small class="doux">Code valable encore <span id="t3reste">${minutes(c.reste)}</span></small>`}</div></div>
      <div class="boutonsfin"><button id="t3ann">Annuler</button>${fini ? `<button class="prim" id="t3re">Recommencer</button>` : ""}</div>`;
    z.querySelector("#t3ann").onclick = async () => { await action("/api/tone3000", {action: "annuler"}); await lireT3(); dessinerT3K(); };
    const re = z.querySelector("#t3re");
    if (re) re.onclick = async () => { if (await action("/api/tone3000", {action: "connecter"})) { await lireT3(); dessinerT3K(); } };
    return;
  }
  if (c && c.etat === "ok" && !t3.res && t3.vue === "liste" && t3.onglet !== "search") { T3.connexion = null; chercherT3(1); }
  const u = T3.utilisateur || {};
  const tete = `<div class="t3tete">${logoT3K()}<span class="t3compte">${u.avatar ? `<img src="${echap(u.avatar)}" alt="" onerror="this.remove()">` : ""}${echap(u.nom || u.username || "")}</span></div>
    <div id="t3etat"></div>`;
  if (t3.vue === "tone") return dessinerTone(z, tete);
  if (t3.vue === "catalogue") return dessinerCatalogue(z, tete);
  const onglets = ONGLETS.filter(([k]) => k !== "search" || T3.recherche);
  if (!T3.recherche && t3.onglet === "search") t3.onglet = "favorited";
  z.innerHTML = tete + `<span class="seg" id="t3ong">${onglets.map(([k, n]) =>
      `<button class="${k === t3.onglet ? "on" : ""}" data-o="${k}">${n}</button>`).join("")}</span>
    ${AVEC_TEXTE.includes(t3.onglet) ? `<div id="t3q" style="margin-top:8px"></div>` : ""}
    <div class="puces">${[["", "Tout"], ["amp", "Ampli"], ["amp-cab", "Ampli + baffle"], ["pedal", "Pédale"], ["outboard", "Rack"]].map(([g, n]) =>
      `<button class="puce${g === t3.gear ? " on" : ""}" data-g="${g}">${n}</button>`).join("")}</div>
    <div id="t3res"></div>
    <div class="boutonsfin"><button id="t3cat">Tout le catalogue sur le téléphone…</button><button class="danger" id="t3dec">Déconnecter</button></div>`;
  z.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
    t3.onglet = b.dataset.o; t3.res = null; t3.erreur = ""; dessinerT3K();
    if (t3.onglet !== "search" || t3.texte) chercherT3(1);
  });
  z.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { t3.gear = b.dataset.g; dessinerT3K(); chercherT3(1); });
  if (AVEC_TEXTE.includes(t3.onglet))
    champRecherche(z, "t3q", t3.texte, (v, fini) => { t3.texte = v; if (fini) chercherT3(1); },
                   t3.onglet === "search" ? "Chercher dans TONE3000 : ampli, pédale, marque…" : "Filtrer par titre…");
  z.querySelector("#t3cat").onclick = () => { t3.vue = "catalogue"; t3.qr = ""; dessinerT3K(); };
  z.querySelector("#t3dec").onclick = () => confirmer("Déconnecter la tête du compte TONE3000 ? Les modèles téléchargés restent sur la tête.", "Déconnecter", async () => {
    await action("/api/tone3000", {action: "deconnecter"}); t3.res = null; feuilleT3K();
  });
  dessinerEtatT3(); dessinerResultats();
}

/* Bandeau : téléchargement en cours, ou modèle en essai (garder / annuler) */
function dessinerEtatT3() {
  const z = $("t3etat"); if (!z || !T3) return;
  const t = T3.tache, e = T3.essai;
  let h = "";
  if (e) h = `<span>Essai : <b>${echap(e.nom)}</b> (${echap(e.tone)}) dans ${echap(nomBloc({id: e.bloc, type: "NAM"}))}. Jouez !</span>
    <button id="t3ann2">Annuler l'essai</button><button class="prim" id="t3garde">Garder</button>`;
  else if (t && !t.fini) h = `<span>Téléchargement ${t.fait + 1}/${t.total} : ${echap(t.en_cours)}…</span><button id="t3stop">Arrêter</button>`;
  else if (t && t.fini) h = `<span>${t.fait - t.erreurs.length - t.deja} modèle(s) de « ${echap(t.titre)} » téléchargé(s)${t.deja ? `, ${t.deja} déjà là` : ""}.${
    t.erreurs.length ? ` <b style="color:var(--mal)">${t.erreurs.length} erreur(s) : ${echap(t.erreurs[0])}</b>` : ""}</span>`;
  z.innerHTML = h;
  const g = z.querySelector("#t3garde");
  if (g) g.onclick = async () => {
    const r = await action("/api/tone3000", {action: "garder", etiquettes: [...t3.etiq]});
    if (r) { t3.ajout = null; message("Modèle gardé dans la bibliothèque", true); await relireBib(); await lireT3(); await maj(true); dessinerT3K(); }
  };
  const a = z.querySelector("#t3ann2");
  if (a) a.onclick = async () => { await action("/api/tone3000", {action: "abandonner"}); await lireT3(); await maj(true); dessinerT3K(); };
  const s = z.querySelector("#t3stop");
  if (s) s.onclick = () => action("/api/tone3000", {action: "stop"});
}

async function chercherT3(page) {
  if (t3.onglet === "search" && !t3.texte.trim() && page === 1 && !t3.gear) { t3.res = null; return dessinerResultats(); }
  t3.charge = true; t3.erreur = ""; dessinerResultats();
  try {
    const r = await api("/api/tone3000", {action: "liste", quoi: t3.onglet, texte: t3.texte, gear: t3.gear, page});
    if (!r || r.ok === false) { t3.erreur = (r && r.erreur) || "Erreur"; if (page === 1) t3.res = null; }
    else if (page > 1 && t3.res) t3.res = {...r, tones: t3.res.tones.concat(r.tones)};
    else t3.res = r;
  } catch (e) { t3.erreur = "Pas de réponse de la tête"; }
  t3.charge = false; dessinerResultats();
}
function dessinerResultats() {
  const z = $("t3res"); if (!z) return;
  const r = t3.res;
  let h = t3.erreur ? `<div class="wres echec">${echap(t3.erreur)}</div>` : "";
  if (!r && !t3.charge && t3.onglet === "search")
    h += `<div class="videmsg">Tapez ce que vous cherchez puis OK.<br><small>Seuls les tones avec des modèles NAM A2 sont montrés.</small></div>`;
  if (r) {
    h += r.tones.length ? `<div class="tgrille">${r.tones.map(t => `<button class="tcarte" data-t="${t.id}">
        <span class="timg">${vignette(t.image)}</span><span class="ttxt"><b>${echap(t.titre)}</b>
        <small>${echap(GEARS[t.gear] || t.gear)} · NAM${t.a2 > 0 ? ` · ${t.a2} A2` : ""}</small>
        <small class="tcre">${t.avatar ? `<img src="${echap(t.avatar)}" alt="" onerror="this.remove()">` : ""}${echap(t.createur)}${t.verifie ? " ✓" : ""}</small>
        ${t.chez_moi ? `<small class="tchez">✓ ${t.chez_moi} sur la tête</small>` : ""}</span></button>`).join("")}</div>`
      : `<div class="videmsg">Rien trouvé${t3.onglet === "favorited" ? " : mettez des tones en favori sur tone3000.com (téléphone ou ordinateur), ils apparaîtront ici" : ""}.</div>`;
    if (r.masques) h += `<div class="pied">${r.masques} tone(s) masqué(s) : pas de modèle NAM A2.</div>`;
    if (r.page < r.pages) h += `<div class="boutonsfin" style="justify-content:center"><button id="t3plus">Plus de résultats</button></div>`;
  }
  if (t3.charge) h += `<div class="videmsg">Recherche…</div>`;
  z.innerHTML = h;
  z.querySelectorAll("[data-t]").forEach(b => b.onclick = () => ouvrirTone(+b.dataset.t));
  const p = z.querySelector("#t3plus"); if (p) p.onclick = () => chercherT3(r.page + 1);
}

async function ouvrirTone(id, frais) {
  t3.vue = "tone"; t3.tone = null; t3.coches = new Set(); dessinerT3K();
  const r = await action("/api/tone3000", {action: "tone", id, frais: !!frais});
  if (!r) { t3.vue = "liste"; return dessinerT3K(); }
  t3.tone = r.tone; t3.modeles = r.modeles; dessinerT3K();
}
function dessinerTone(z, tete) {
  const t = t3.tone;
  if (!t) { z.innerHTML = tete + `<div class="videmsg">Lecture du tone…</div>`; return dessinerEtatT3(); }
  const nouveaux = t3.modeles.filter(m => !m.fichier);
  const tout = nouveaux.length > 0 && nouveaux.every(m => t3.coches.has(m.id));
  const enCoursT = T3.tache && !T3.tache.fini;
  z.innerHTML = tete + `<div class="rangs" style="margin:0 0 8px"><button id="t3ret">◀ Résultats</button></div>
    <div class="fiche"><div class="fimg">${vignette(t.image)}</div><div style="min-width:0">
      <div class="fnom">${echap(t.titre)}</div>
      <div class="tcre doux">${t.avatar ? `<img src="${echap(t.avatar)}" alt="" style="width:18px;height:18px;border-radius:50%" onerror="this.remove()">` : ""}${echap(t.createur)}${t.verifie ? " ✓" : ""}</div>
      <div class="doux">${echap([GEARS[t.gear] || t.gear, "NAM", ...t.makes].filter(Boolean).join(" · "))}${t.licence ? " · licence " + echap(t.licence) : ""}</div>
      ${t.tags.length ? `<div class="betq" style="justify-content:flex-start;max-width:none;margin-top:4px">${t.tags.map(x => `<i>${echap(x)}</i>`).join("")}</div>` : ""}
      ${t.description ? `<div class="tdesc">${echap(t.description)}</div>` : ""}</div></div>
    <div class="etiq">Modèles A2 (${t3.modeles.length}) : cochez ceux à télécharger, ou essayez-les d'abord</div>
    <div>${t3.modeles.map(m => `<div class="mligne"><label>${m.fichier ? `<span style="color:var(--accent);width:22px">✓</span>` :
        `<input type="checkbox" data-c="${m.id}" ${t3.coches.has(m.id) ? "checked" : ""}>`}<span>${echap(m.nom)}</span>
        <small>${echap(m.taille)}${m.fichier ? " · sur la tête" : ""}</small></label>
        <button data-essai="${m.id}">${m.fichier ? "Charger" : "Essayer"}</button></div>`).join("") ||
      `<div class="videmsg">Pas de modèle A2 dans ce tone.</div>`}</div>
    ${nouveaux.length > 1 ? `<div class="mligne"><label><input type="checkbox" id="t3tout" ${tout ? "checked" : ""}><span>Tout télécharger</span></label></div>` : ""}
    <div class="etiq">Étiquettes à mettre sur les modèles téléchargés ou gardés</div>
    <div class="puces" style="flex-wrap:wrap">${(B ? B.etiquettes : []).map(e => `<button class="puce${t3.etiq.has(e) ? " on" : ""}" data-x="${echap(e)}">${echap(e)}</button>`).join("")}</div>
    <div class="boutonsfin">${ECRAN ? "" : `<a href="${echap(t.url)}" target="_blank" rel="noopener" class="doux" style="margin-right:auto;align-self:center">Voir sur tone3000.com</a>`}
      <button class="prim" id="t3dl" ${t3.coches.size && !enCoursT ? "" : "disabled"}>Télécharger${t3.coches.size ? ` (${t3.coches.size})` : ""}</button></div>`;
  dessinerEtatT3();
  z.querySelector("#t3ret").onclick = () => { t3.vue = "liste"; dessinerT3K(); };
  z.querySelectorAll("[data-c]").forEach(c => c.onchange = () => {
    const id = +c.dataset.c; c.checked ? t3.coches.add(id) : t3.coches.delete(id); dessinerT3K();
  });
  const tt = z.querySelector("#t3tout");
  if (tt) tt.onchange = () => { t3.coches = tt.checked ? new Set(nouveaux.map(m => m.id)) : new Set(); dessinerT3K(); };
  z.querySelectorAll("[data-x]").forEach(b => b.onclick = () => {
    const x = b.dataset.x; t3.etiq.has(x) ? t3.etiq.delete(x) : t3.etiq.add(x); dessinerT3K();
  });
  z.querySelectorAll("[data-essai]").forEach(b => b.onclick = async () => {
    const m = t3.modeles.find(x => x.id === +b.dataset.essai);
    b.disabled = true; b.textContent = "…";
    if (!m.fichier) message("Téléchargement de l'essai…", true);
    const r = await action("/api/tone3000", t3.ajout
      ? {action: "essayer", tone_id: t.id, model_id: m.id, nouveau: true, apres: t3.ajout.apres}
      : {action: "essayer", tone_id: t.id, model_id: m.id, bloc: sel});
    if (r && r.deja) t3.ajout = null;                // modèle déjà là : le bloc est ajouté
    if (r) { sel = r.bloc; message(m.fichier ? `« ${nomAffiche(m.fichier)} » chargé` : `Essai de « ${m.nom} » : jouez !`, true); }
    await relireBib(); await lireT3(); await maj(true); dessinerT3K();
  });
  z.querySelector("#t3dl").onclick = async () => {
    const r = await action("/api/tone3000", {action: "telecharger", tone_id: t.id, modeles: [...t3.coches], etiquettes: [...t3.etiq]});
    if (r) { t3.coches = new Set(); message("Téléchargement lancé", true); await lireT3(); dessinerT3K(); }
    // à la fin, la liste des modèles est relue (boucle de la feuille)
    const fin = setInterval(async () => {
      if (!t3Ouverte() || !T3 || (T3.tache && T3.tache.fini)) {
        clearInterval(fin);
        if (t3Ouverte() && t3.vue === "tone" && t3.tone && t3.tone.id === t.id) {
          const r2 = await api("/api/tone3000", {action: "tone", id: t.id}).catch(() => null);
          if (r2 && r2.ok !== false) { t3.modeles = r2.modeles; await relireBib(); dessinerT3K(); }
        }
      }
    }, 1000);
  };
}

/* Tout le catalogue (page TONE3000, avec sa recherche) sur le téléphone : le
   tone choisi revient à la tête par le réseau local et s'ouvre ici. */
async function dessinerCatalogue(z, tete) {
  z.innerHTML = tete + `<div class="rangs" style="margin:0 0 8px"><button id="t3ret">◀ Résultats</button></div><div id="t3cq" class="videmsg">…</div>`;
  z.querySelector("#t3ret").onclick = () => { t3.vue = "liste"; dessinerT3K(); };
  dessinerEtatT3();
  if (!t3.qr) {
    const r = await action("/api/tone3000", {action: "catalogue", hote: TRANSPORT() ? "" : location.host});
    if (!r) { t3.vue = "liste"; return dessinerT3K(); }
    t3.qr = r.url;
  }
  const q = $("t3cq"); if (!q) return;
  q.className = "";
  q.innerHTML = `<div class="t3qr">${qrSvg(t3.qr, ECRAN ? 190 : 220)}<div class="t3etapes">
      Scannez avec votre téléphone, <b>sur le même Wi-Fi que la tête</b> : le catalogue TONE3000 complet s'ouvre, avec sa recherche.<br><br>
      Choisissez un tone : il s'ouvre ici, sur la tête, pour essayer ou télécharger ses modèles.
      ${ECRAN ? "" : `<br><br><a href="${echap(t3.qr)}" target="_blank" rel="noopener">Ouvrir le catalogue dans un nouvel onglet</a>`}</div></div>`;
}

function entrerCle(retour) {
  demanderNom("Clé TONE3000 (t3k_pub_…)", "", async v => {
    if (await action("/api/tone3000", {action: "cle", valeur: v.trim()})) message("Clé enregistrée", true);
    retour();
  }, {mdp: true, bouton: "Enregistrer", annuler: retour,
      texte: "Clé publique de l'application, créée sur tone3000.com → Settings → API Keys."});
}

/* ---------- Mise à jour ---------- */
function redessiner() {
  if (occupe) { aRedessiner = true; return; }
  aRedessiner = false;
  if (T && !T.chaine.some(b => b.id === sel)) sel = T.chaine.length ? T.chaine[0].id : null;
  dessinerHaut(); dessinerChaine(); dessinerPanneau();
}
let enCours = false;
async function maj(forcer) {
  if (enCours && !forcer) return;
  enCours = true;
  try {
    E = await api("/api/etat");
    let change = false;
    if (!C || C.cfg !== E.cfg) { C = await api("/api/config"); change = true; }
    if (forcer || !T || T.rev !== E.rev) { T = await api("/api/tout"); change = true; }
    const cb = E.bib + "|" + E.cfg + "|" + E.t3k;
    if (!B || cb !== cleBib) { cleBib = cb; await relireBib(); change = true; }
    if (change) redessiner(); else dessinerHaut();
  } catch (e) {
    $("bandeau").classList.add("ouvert"); $("bandeau").textContent = "Pas de connexion avec la tête…";
  } finally { enCours = false; }
}
/* État redemandé chaque seconde (1,5 s en Bluetooth), plus vite avec l'accordeur */
function boucleMaj() {
  const accordeur = $("accord").classList.contains("ouvert");
  setTimeout(async () => { await maj(); boucleMaj(); }, BLE() ? (accordeur ? 500 : 1500) : (accordeur ? 300 : 1000));
}
maj().then(boucleMaj);
</script></body></html>
