<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Écran 800×480</title>
<style>
  html,body{margin:0;height:100%;background:#050608;overflow:hidden}
  #cadre{position:absolute;left:50%;top:50%;width:800px;height:480px;transform-origin:center;
         border:18px solid #1b1d22;border-radius:14px;box-shadow:0 0 0 1px #2b2e35,0 20px 60px #000}
  iframe{width:800px;height:480px;border:0;display:block;background:#111317}
  #retour{position:fixed;left:10px;top:8px;color:#8a8f99;font:13px system-ui,sans-serif;text-decoration:none}
</style></head>
<body>
<a id="retour" href="index.html">‹ Retour</a>
<div id="cadre"><iframe id="ui" src="ui.html?ecran=1" title="Interface Tête NAM 800×480"></iframe></div>
<script>
  // Écran 7" de la tête : 800×480, agrandi ou réduit pour tenir dans la fenêtre
  const cadre = document.getElementById("cadre");
  function ajuster() {
    const k = Math.min((innerWidth - 20) / 836, (innerHeight - 50) / 516);
    cadre.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }
  addEventListener("resize", ajuster); ajuster();
  // Sur la tête, le pointeur est caché ; ici on le garde pour la souris
  document.getElementById("ui").addEventListener("load", e => {
    try {
      const s = e.target.contentDocument.createElement("style");
      s.textContent = "body.ecran{cursor:auto!important}";
      e.target.contentDocument.head.appendChild(s);
    } catch (err) { /* rien */ }
  });
</script>
</body></html>
